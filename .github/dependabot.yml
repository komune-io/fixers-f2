version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "daily"
    # Every BOM in f2-gradle-bom is now a catalog entry Dependabot can track; the default
    # limit of 5 open PRs would otherwise silently stop version updates.
    open-pull-requests-limit: 10
    groups:
      kotlinx:
        patterns:
          - "org.jetbrains.kotlinx:*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
