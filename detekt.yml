naming:
  PackageNaming:
    # Allow digits in first segment for f2.* packages (default pattern only allows [a-z]+)
    packagePattern: '[a-z0-9]+(\.[a-z][A-Za-z0-9]*)*'

complexity:
  TooManyFunctions:
    excludes: ['**/test/**', '**/androidTest/**', '**/commonTest/**', '**/jvmTest/**', '**/androidUnitTest/**', '**/androidInstrumentedTest/**', '**/jsTest/**', '**/iosTest/**', '**/org/springframework/**']

style:
  ReturnCount:
    excludes: ['**/org/springframework/**']

coroutines:
  SuspendFunWithFlowReturnType:
    # F2Function, F2Supplier and F2Consumer are `suspend fun …(): Flow` by design.
    active: false
